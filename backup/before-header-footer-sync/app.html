            display: flex;
            align-items: center;
            justify-content: center;

            background: linear-gradient(135deg, #020b20, #031a3e 48%, #043b72);
            color: #ffffff;
        }

        .app-card {
            width: min(92vw, 620px);
            padding: 42px 30px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.25);
            text-align: center;
        }

        .badge {
            display: inline-block;
            margin-bottom: 18px;
            padding: 8px 14px;

            background: rgba(22, 140, 255, 0.18);
            color: #a9d4ff;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0 0 12px;
            font-size: clamp(28px, 5vw, 42px);
            line-height: 1.15;
        }

        p {
            margin: 0 0 24px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 16px;
            line-height: 1.6;
        }

        .store-buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 14px;
            margin-top: 20px;
        }

        .store-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 220px;
            padding: 14px 18px;
            border-radius: 10px;
            background: linear-gradient(135deg, #198cff, #0875ed);
            color: #ffffff;
            text-decoration: none;
            font-weight: 700;
            transition: transform 0.2s ease, filter 0.2s ease;
        }

        .store-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.08);
        }

        .secondary {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .home-link {
            display: inline-block;
            margin-top: 24px;
            color: #dfeeff;
            text-decoration: none;
            font-weight: 600;
        }
